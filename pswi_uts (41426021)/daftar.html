<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pertama Saya</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Selamat Datang di situs saya</h1>
        <nav aria-label="Navigasi utama">
            <ul class="nav-list">
                <li><a href="index.html">beranda</a></li>

            </ul>
        </nav>
    </header>
    <main>


        <h1>Pendaftaran Kegiatan</h1>

        <figure>
            <img src="images/HTML.jpg" alt="Mau ngapain nich hari ini">
            <figcaption>Lokasi kegiatan: aula kampus.</figcaption>
        </figure>

        
<form method="get" class="form-pendaftaran card">
    <p class="notice">Kolom bertanda wajib harus diisi.</p>

    <label for="nama">Nama lengkap (wajib)</label>
    <input id="nama" name="nama" autocomplete="name" required>
    <small>Masukkan nama lengkap kamu.</small>

    <label for="email">Email (wajib)</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <small>Contoh: ela@email.com</small>


    <label for="NIM">Nomor induk mahasiswa (8 angka, wajib)</label>
    <p id="NIM-help">Contoh: 41426011. Gunakan tepat delapan angka.</p>
    <input id="NIM" name="NIM" type="text" inputmode="numeric" pattern="[0-9]{8}" aria-describedby="NIM-help" required>

<label for="pilihan kegiatan">pilihan kegiatan (wajib)</label>
<select id="pilihan kegiatan" name="kegiatan" required>
    <option value="" disabled selected>Pilih kegiatan</option>
    <option value="Belajar css">CSS</option>
    <option value="Belajar HTML">HTML</option>
</select>

            <fieldset>
                <legend>Persetujuan(wajib)</legend>
                <input id="Persetujuan" name="mode" type="radio" value="Setuju" required>
                <label for="Setuju">Setuju</label>
                <input id="Tidak Setuju" name="mode" type="radio" value="Tidak setuju">
                <label for="Tidak setuju">Tidak setuju</label>
            </fieldset>
        
          
            <button type="submit">Daftar</button>
        </form>
    </main>
    <script src="js/main.js"></script>
</body>

</html>
